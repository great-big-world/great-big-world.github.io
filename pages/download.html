<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../components/header.js"></script>
    <script type="module" src="../components/version_type_label.js"></script>
    <script type="module" src="../components/version_card.js"></script>
    <script type="module" src="../components/footer.js"></script>
    <title>GBW - Download</title>
</head>
<body class="page">

    <gbw-header></gbw-header>

    <main>
        <h1>Download Great Big World</h1>

        <p class="subtitle">
            The recommended method to download is through
            <a class="modrinth-url" href="https://modrinth.com/">Modrinth</a>
        </p>

        <div id="versions-list"></div>
    </main>

    <script>
        const versionsList = document.getElementById('versions-list');

        async function getVersions() {
            const response = await fetch(
                "https://api.modrinth.com/v2/project/great-big-world/version?include_changelog=false"
            );

            const versions = await response.json();

            versions.forEach(version => {
                const card = document.createElement('gbw-version-card');

                card.setAttribute("version-title", version.name);
                card.setAttribute("version-type", version.version_type);
                card.setAttribute("version-downloads", version.downloads);
                card.setAttribute("version-url", version.id);

                versionsList.appendChild(card);
            });
        }

        getVersions();
    </script>

    <gbw-footer></gbw-footer>

</body>
</html>
