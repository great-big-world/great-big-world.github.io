<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="components/header.js"></script>
    <script type="module" src="components/submod_card.js"></script>
    <script type="module" src="components/footer.js"></script>
    <title>Great Big World</title>
</head>
<body class="page">

    <gbw-header home="true"></gbw-header>

    <main>
        <h1>Welcome to Great Big World</h1>
        <p class="subtitle">An alternate timeline mod for modern Minecraft</p>

        <h1 class="section-header">Explore</h1>

        <div class="submods-grid">
            <gbw-submod-card name="Core" description="Internal library for Great Big World" page="mods/gbw_core/" img-src="https://raw.githubusercontent.com/great-big-world/assets/refs/heads/main/assets/backgrounds/mods/gbw_core.png"></gbw-submod-card>
            <gbw-submod-card name="Adventures" description="Exploration & world improvements" page="mods/adventures/" img-src="https://raw.githubusercontent.com/great-big-world/assets/refs/heads/main/assets/backgrounds/mods/adventures.png"></gbw-submod-card>
            <gbw-submod-card name="Architect's Assembly" description="Building utilities & various decorative additions/improvements" page="mods/architects_assembly/" img-src="https://raw.githubusercontent.com/great-big-world/assets/refs/heads/main/assets/backgrounds/mods/architects_assembly.png"></gbw-submod-card>
            <gbw-submod-card name="Flora & Fauna" description="Seasons & biome overhauls" page="mods/flora_and_fauna/" img-src="https://raw.githubusercontent.com/great-big-world/assets/refs/heads/main/assets/backgrounds/mods/flora_and_fauna.png"></gbw-submod-card>
            <gbw-submod-card name="Relics & Ruins" description="New temples & loot overhauls" page="mods/relics_and_ruins/" img-src="https://raw.githubusercontent.com/great-big-world/assets/refs/heads/main/assets/backgrounds/mods/relics_and_ruins.png"></gbw-submod-card>

            <gbw-submod-card name="The Alterworld" description="An alternate Overworld dimension to cater to an extrinsic, exploratory playstyle" page="mods/the_alterworld/" img-src="https://raw.githubusercontent.com/great-big-world/assets/refs/heads/main/assets/backgrounds/mods/the_alterworld.png"></gbw-submod-card>
            <gbw-submod-card name="Standalone Mods" description="Small-feature external mods packaged within Great Big World" page="mods/standalone_submods/" img-src="https://raw.githubusercontent.com/great-big-world/assets/refs/heads/main/assets/backgrounds/mods/architects_assembly.png"></gbw-submod-card>

    <gbw-footer></gbw-footer>
