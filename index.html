<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="components/header.js"></script>
    <script type="module" src="components/submod_card.js"></script>
    <script type="module" src="components/footer.js"></script>
    <title>Great Big World</title>
</head>
<body class="page">

    <gbw-header home="true"></gbw-header>

    <main>
        <h1>Welcome to Great Big World</h1>
        <p class="subtitle">An alternate timeline mod for modern Minecraft</p>

        <h1 class="section-header">Explore</h1>

        <div class="submods-grid">
            <gbw-submod-card name="Core" description="Internal library for Great Big World" page="pages/gbw_core.html" img-src="assets/backgrounds/gbw_core.png"></gbw-submod-card>
            <gbw-submod-card name="Adventures" description="Exploration & world improvements" page="pages/adventures.html" img-src="assets/backgrounds/architects_assembly.png"></gbw-submod-card>
            <gbw-submod-card name="Architect's Assembly" description="Building utilities & various decorative additions/improvements" page="pages/architects_assembly.html" img-src="assets/backgrounds/architects_assembly.png"></gbw-submod-card>
            <gbw-submod-card name="Flora & Fauna" description="Seasons & biome overhauls" page="pages/flora_and_fauna.html" img-src="assets/backgrounds/flora_and_fauna.png"></gbw-submod-card>
            <gbw-submod-card name="Relics & Ruins" description="New temples & loot overhauls" page="pages/relics_and_ruins.html" img-src="assets/backgrounds/relics_and_ruins.png"></gbw-submod-card>
            <gbw-submod-card name="Swords & Shields" description="Equipment overhauls, enchanting, & armor decoration" page="pages/swords_and_shields.html" img-src="assets/backgrounds/swords_and_shields.png"></gbw-submod-card>
            <gbw-submod-card name="The Alterworld" description="An alternate Overworld dimension to cater to an extrinsic, exploratory playstyle" page="pages/the_alterworld.html" img-src="assets/backgrounds/the_alterworld.png"></gbw-submod-card>
            <gbw-submod-card name="Standalone Mods" description="Small-feature external mods packaged within Great Big World" page="pages/standalone_submods.html" img-src="assets/backgrounds/architects_assembly.png"></gbw-submod-card>
        </div>
    </main>

    <gbw-footer></gbw-footer>

</body>
</html>
